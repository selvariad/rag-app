<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Enterprise Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="sidebar-nav">
  <div class="nav-brand">
    <div class="brand-icon">R</div>
    <span class="brand-text">RAG</span>
  </div>
  <a href="/" class="nav-item active" data-page="chat">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <span>Chat</span>
  </a>
  <a href="/documents" class="nav-item" data-page="documents">
    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <span>Documents</span>
  </a>
  <div class="nav-footer">
    <span class="badge model-badge" title="Current model">{{ llm_provider }}/{{ llm_model }}</span>
  </div>
</nav>

<main class="main-content">
  <div class="chat-container">
    <div class="chat-messages" id="chat-messages">
      <div class="welcome-screen">
        <div class="welcome-icon">R</div>
        <h2>Ask anything about your documents</h2>
        <p>Upload documents and ask questions. I'll find answers with source citations.</p>
      </div>
    </div>

    <div id="thinking-indicator" class="thinking-bar hidden">
      <div class="thinking-dots"><span></span><span></span><span></span></div>
      <span id="thinking-text">Thinking...</span>
    </div>

    <form class="chat-input-bar" id="query-form">
      <input type="text" id="question-input" placeholder="Ask about your documents..." autofocus autocomplete="off">
      <button type="submit" id="send-btn" class="btn-send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>
  </div>
</main>

<script>
(function() {
  const messagesEl = document.getElementById('chat-messages');
  const thinkingEl = document.getElementById('thinking-indicator');
  const thinkingText = document.getElementById('thinking-text');
  const form = document.getElementById('query-form');
  const input = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  let currentAssistantMsg = null;
  let currentSourcesEl = null;

  function showThinking() {
    thinkingEl.classList.remove('hidden');
    sendBtn.disabled = true;
    input.disabled = true;
  }

  function hideThinking() {
    thinkingEl.classList.add('hidden');
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }

  function hideWelcome() {
    const welcome = messagesEl.querySelector('.welcome-screen');
    if (welcome) welcome.remove();
  }

  function addUserMessage(text) {
    hideWelcome();
    const div = document.createElement('div');
    div.className = 'message user';
    div.innerHTML = '<p>' + escapeHtml(text) + '</p>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function ensureAssistantMsg() {
    if (!currentAssistantMsg) {
      currentAssistantMsg = document.createElement('div');
      currentAssistantMsg.className = 'message assistant';
      currentSourcesEl = document.createElement('div');
      currentSourcesEl.className = 'msg-sources';
      currentAssistantMsg.appendChild(currentSourcesEl);
      const contentDiv = document.createElement('div');
      contentDiv.className = 'msg-content';
      currentAssistantMsg.appendChild(contentDiv);
      messagesEl.appendChild(currentAssistantMsg);
    }
    return currentAssistantMsg.querySelector('.msg-content');
  }

  function addSourceChip(text) {
    if (currentSourcesEl && !currentSourcesEl.querySelector('[data-text="' + CSS.escape(text).substring(0,20) + '"]')) {
      const chip = document.createElement('span');
      chip.className = 'source-chip animate-in';
      chip.textContent = text.substring(0, 80) + (text.length > 80 ? '...' : '');
      chip.setAttribute('data-text', text.substring(0,20));
      currentSourcesEl.appendChild(chip);
    }
  }

  function appendToken(char) {
    const content = ensureAssistantMsg();
    content.textContent += char;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function finishMessage() {
    currentAssistantMsg = null;
    currentSourcesEl = null;
    hideThinking();
  }

  function handleError(msg) {
    const content = ensureAssistantMsg();
    content.textContent = 'Sorry, something went wrong. ' + msg;
    finishMessage();
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    input.value = '';

    addUserMessage(question);
    showThinking();

    try {
      const resp = await fetch('/api/query/stream', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: question, namespace: 'default'}),
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            switch (data.event) {
              case 'step':
                thinkingText.textContent = data.data;
                break;
              case 'source':
                addSourceChip(data.data);
                break;
              case 'token':
                appendToken(data.data);
                break;
              case 'error':
                handleError(data.data);
                return;
              case 'done':
                finishMessage();
                break;
            }
          } catch(e) {}
        }
      }
    } catch(err) {
      handleError('Network error: ' + err.message);
    }
  });
})();
</script>
</body>
</html>
